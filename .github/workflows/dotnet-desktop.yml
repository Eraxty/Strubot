name: Build Strubot

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
            name: linux-x64
          - runner: windows-2025
            rid: win-x64
            name: windows-x64
          - runner: macos-15-intel
            rid: osx-x64
            name: macos-x64
          - runner: macos-15
            rid: osx-arm64
            name: macos-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file app
        run: dotnet publish Strubot.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish

      - name: Name the download
        shell: bash
        run: |
          if [ -f publish/Strubot.exe ]; then
            mv publish/Strubot.exe "publish/Strubot-${{ matrix.name }}.exe"
          else
            mv publish/Strubot "publish/Strubot-${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Strubot-${{ matrix.name }}
          path: publish/Strubot-${{ matrix.name }}*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Strubot-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
